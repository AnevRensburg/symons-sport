<a class="skip-link" href="#main">Skip to content</a>
<header class="header">
  <div class="header__inner container">
    <a class="header__logo" routerLink="/" aria-label="Symons Sport International home">
      <app-picture
        src="logos/ssi-logo"
        alt="Symons Sport International logo"
        sizes="(min-width: 64em) 220px, 150px"
        [eager]="true"
      />
    </a>

    <button
      #menuButton
      type="button"
      class="header__toggle"
      aria-controls="site-nav"
      [attr.aria-expanded]="menuOpen()"
      (click)="toggle()"
    >
      <app-icon [name]="menuOpen() ? 'close' : 'menu'" />
      <span class="visually-hidden">{{ menuOpen() ? 'Close menu' : 'Open menu' }}</span>
    </button>

    <nav id="site-nav" class="nav" [class.nav--open]="menuOpen()" aria-label="Main">
      <ul class="nav__list" role="list">
        @for (link of links; track link.path) {
          <li>
            <a
              class="nav__link"
              [routerLink]="link.path"
              routerLinkActive="nav__link--active"
              ariaCurrentWhenActive="page"
              [routerLinkActiveOptions]="{ exact: link.exact }"
              >{{ link.label }}</a
            >
          </li>
        }
      </ul>
    </nav>
  </div>
</header>
